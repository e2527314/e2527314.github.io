<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./css/main.css">

    <title>私の休日</title>
</head>

<body>

    <div class="container">

        <header id="top">
            <h1>🌷 私の休日</h1>

            <nav class="gnav">
                <ul>
                    <li>ホーム</li>
                    <li>趣味</li>
                    <li>メッセージ</li>
                </ul>
            </nav>
        </header>

        <aside>
            <h2>好きなこと</h2>

            <ul>
                <li>カフェ巡り</li>
                <li>ショッピング</li>
                <li>音楽を聴くこと</li>
            </ul>
        </aside>

        <main>

            <section>
                <h2>休日の過ごし方</h2>

                <p>
                    私は休日に友達とカフェに行ったり、
                    買い物をしたりして過ごしています。
                </p>
            </section>

            <section>
                <h2>よく行く場所</h2>

                <table>
                    <tr>
                        <th>場所</th>
                        <th>理由</th>
                    </tr>

                    <tr>
                        <td>カフェ</td>
                        <td>落ち着くから</td>
                    </tr>

                    <tr>
                        <td>ショッピングモール</td>
                        <td>服を見るのが好きだから</td>
                    </tr>

                    <tr>
                        <td>公園</td>
                        <td>リラックスできるから</td>
                    </tr>
                </table>
            </section>

            <section>
                <h2>今日のメッセージ</h2>

                <p id="message">
                    ボタンを押してください！
                </p>

                <button id="btn">
                    メッセージを変える
                </button>
            </section>

            <p><a href="#top">トップへ戻る</a></p>

        </main>

        <footer>
            Copyright © Hiilo Kobayashi
        </footer>

    </div>

    <script src="./js/main.js"></script>

</body>
</html>
